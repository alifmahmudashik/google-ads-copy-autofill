<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Ads Copy Fillup</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="wrapper">

    <header class="appbar">
      <img src="img/icon48.png" alt="" class="logo">
      <h1 class="title">Ads Copy Fillup</h1>
      <span class="ctx-chip" id="ctxChip"><span class="ctx-dot"></span><span id="ctxLabel">Checking…</span></span>
    </header>

    <main class="content">

      <!-- Quick Actions -->
      <section class="card quick-card">
        <div>
          <h2 class="card-title">Fill all assets at once</h2>
          <p class="card-help">Paste your copy block to fill 15 headlines, 5 long headlines &amp; descriptions at once.</p>
        </div>
        <div class="quick-btn-group">
          <button class="btn btn-filled btn-quick-all" id="quickPasteBtn" title="Read clipboard and fill Google Ads fields">
            <svg class="btn-icon" viewBox="0 0 24 24" fill="currentColor"><path d="M19 2h-4.18C14.4.84 13.3 0 12 0S9.6.84 9.18 2H5c-1.1 0-2 .9-2 2v16c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm-7 0c.55 0 1 .45 1 1s-.45 1-1 1-1-.45-1-1 .45-1 1-1zm7 18H5V4h2v3h10V4h2v16z"/></svg>
            <span class="btn-text">Paste &amp; fill</span>
          </button>
          <button class="btn btn-outlined btn-quick-page" id="copyAllFromPageBtn" title="Copy headlines, long headlines and descriptions from the page">
            <svg class="btn-icon" viewBox="0 0 24 24" fill="currentColor"><path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/></svg>
            <span class="btn-text">Copy from page</span>
          </button>
        </div>
        <div class="status" id="quickStatus"></div>
      </section>

      <!-- Editor card -->
      <section class="card editor-card">
        <nav class="tabs">
          <button class="tab-btn active" id="tabHeadlines" data-tab="headlines">
            Headlines <span class="tab-badge" data-badge="headlinesInput">0/15</span>
          </button>
          <button class="tab-btn" id="tabLongHeadlines" data-tab="long-headlines">
            Long <span class="tab-badge" data-badge="longHeadlinesInput">0/5</span>
          </button>
          <button class="tab-btn" id="tabDescriptions" data-tab="descriptions">
            Descriptions <span class="tab-badge" data-badge="descriptionsInput">0/5</span>
          </button>
        </nav>

        <!-- Headlines -->
        <div class="tab-content active" id="section-headlines">
          <div class="toolbar">
            <span class="rule">Up to 15 · 30 characters each</span>
            <div class="toolbar-actions">
              <button class="btn-text-only" data-paste="headlinesInput">Paste</button>
              <button class="btn-text-only muted" data-clear="headlinesInput">Clear</button>
            </div>
          </div>
          <div class="editor">
            <div class="editor-inner">
              <div class="mirror" aria-hidden="true"></div>
              <textarea id="headlinesInput" class="textarea" data-max="30" data-cap="15" spellcheck="false"
                placeholder="Paste all headlines here, one per line"></textarea>
            </div>
          </div>
          <div class="char-hint" id="headlineCharHint"></div>
          <div class="actions">
            <button class="btn btn-danger-text" id="removeHeadlinesBtn">Clear page</button>
            <span class="spacer"></span>
            <button class="btn btn-outlined" id="copyHeadlinesBtn">Pull from page</button>
            <button class="btn btn-filled" id="fillHeadlinesBtn">Fill headlines</button>
          </div>
          <div class="status" id="headlineStatus"></div>
        </div>

        <!-- Long Headlines -->
        <div class="tab-content" id="section-long-headlines">
          <div class="toolbar">
            <span class="rule">Up to 5 · 90 characters each</span>
            <div class="toolbar-actions">
              <button class="btn-text-only" data-paste="longHeadlinesInput">Paste</button>
              <button class="btn-text-only muted" data-clear="longHeadlinesInput">Clear</button>
            </div>
          </div>
          <div class="editor">
            <div class="editor-inner">
              <div class="mirror" aria-hidden="true"></div>
              <textarea id="longHeadlinesInput" class="textarea" data-max="90" data-cap="5" spellcheck="false"
                placeholder="Paste all long headlines here, one per line"></textarea>
            </div>
          </div>
          <div class="char-hint" id="longHeadlineCharHint"></div>
          <div class="actions">
            <button class="btn btn-danger-text" id="removeLongHeadlinesBtn">Clear page</button>
            <span class="spacer"></span>
            <button class="btn btn-outlined" id="copyLongHeadlinesBtn">Pull from page</button>
            <button class="btn btn-filled" id="fillLongHeadlinesBtn">Fill long headlines</button>
          </div>
          <div class="status" id="longHeadlineStatus"></div>
        </div>

        <!-- Descriptions -->
        <div class="tab-content" id="section-descriptions">
          <div class="toolbar">
            <span class="rule">Up to 5 · 90 characters each</span>
            <div class="toolbar-actions">
              <button class="btn-text-only" data-paste="descriptionsInput">Paste</button>
              <button class="btn-text-only muted" data-clear="descriptionsInput">Clear</button>
            </div>
          </div>
          <div class="editor">
            <div class="editor-inner">
              <div class="mirror" aria-hidden="true"></div>
              <textarea id="descriptionsInput" class="textarea" data-max="90" data-cap="5" spellcheck="false"
                placeholder="Paste all descriptions here, one per line"></textarea>
            </div>
          </div>
          <div class="char-hint" id="descriptionCharHint"></div>
          <div class="actions">
            <button class="btn btn-danger-text" id="removeDescriptionsBtn">Clear page</button>
            <span class="spacer"></span>
            <button class="btn btn-outlined" id="copyDescriptionsBtn">Pull from page</button>
            <button class="btn btn-filled" id="fillDescriptionsBtn">Fill descriptions</button>
          </div>
          <div class="status" id="descriptionStatus"></div>
        </div>
      </section>

    </main>

    <footer class="footer">
      <span>Made by <a href="https://alifmahmud.com" target="_blank">alifmahmud.com</a></span>
      <span>v2.2</span>
    </footer>

  </div>
  <script src="popup.js"></script>
  <script src="popup-editor.js"></script>
</body>
</html>
